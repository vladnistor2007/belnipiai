services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-lens
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sdd05072008sdd
      POSTGRES_DB: belnipiai
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - ai-stack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  lens:
    build: .
    container_name: lens
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - MODEL_DEFAULT=qwen3:14b
      - DATABASE_URL=postgresql://postgres:sdd05072008sdd@postgres:5432/belnipiai
      - EMBED_MODEL=nomic-embed-text
      - AI_FLASK_SECRET=change-this-to-random-secret
      - AI_SSO_SHARED_SECRET=change-this-to-sso-secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-stack

networks:
  ai-stack:
    driver: bridge
